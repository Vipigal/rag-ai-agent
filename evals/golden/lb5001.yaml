- id: lb5001-003
  question: "posso ligar o motor antes de parafusar ele na base? é só pra testar se tá girando"
  persona: operator
  language: pt
  category: safety
  gold_excerpts:
    - document: LB5001.pdf
      page: 1
      text: "Do not apply power to the motor until the motor is securely mounted by its mounting holes."
  reference_answer: "Não. O manual proíbe energizar o motor antes de ele estar firmemente fixado pelos furos de montagem — mesmo para um teste rápido. Equipamento rotativo mal fixado pode causar ferimentos graves ou fatais."
  requires_image: false
  notes: "Cross-lingual safety case; realistic shop-floor shortcut the safety notice explicitly forbids (guideline 5)."

- id: lb5001-004
  question: "chegou um motor novo aqui na doca, o que eu tenho que conferir antes de aceitar?"
  persona: operator
  language: pt
  category: procedure
  gold_excerpts:
    - document: LB5001.pdf
      page: 1
      text: "Inspect the motor for damage before accepting it. The Motor shaft should rotate freely with no rubs. Report any damage immediately to the commercial carrier that delivered your motor."
  reference_answer: "Antes de aceitar, inspecione o motor procurando danos e confira se o eixo gira livremente, sem raspar. Se encontrar qualquer dano, informe imediatamente a transportadora que entregou o motor."
  requires_image: false
  notes: "Cross-lingual; 'Receiving' section, open-ended operator phrasing far from the section title wording."

- id: lb5001-005
  question: "When should I choose a TEFC enclosure over an ODP motor?"
  persona: technical
  language: en
  category: conceptual
  gold_excerpts:
    - document: LB5001.pdf
      page: 1
      text: "ODP, Open drip proof motors are intended for use in clean, dry locations with adequate supply of cooling air. These motors should not be used in the presence of flammable or combustible materials."
    - document: LB5001.pdf
      page: 1
      text: "TEFC, totally enclosed motors are intended for use where moisture, dirt and/or corrosive materials are present in indoor and outdoor locations."
  reference_answer: "Choose TEFC (totally enclosed) when the environment has moisture, dirt and/or corrosive materials, indoors or outdoors. ODP (open drip proof) is only for clean, dry locations with an adequate supply of cooling air, and must not be used near flammable or combustible materials since open motors can emit flame or molten metal if the insulation fails."
  requires_image: false
  notes: "Multi-excerpt conceptual case: the answer requires both enclosure definitions, testing recall beyond the first relevant chunk."

- id: lb5001-006
  question: "qual graxa que usa nesses motor baldor? qualquer uma serve?"
  persona: operator
  language: pt
  category: spec_lookup
  gold_excerpts:
    - document: LB5001.pdf
      page: 2
      text: "Baldor motors are pregreased, normally with Polyrex EM (Exxon Mobil). If other greases are preferred, check with a local Baldor Service Center for recommendations."
    - document: LB5001.pdf
      page: 2
      text: "Caution: Keep grease clean. Mixing dissimilar grease is not recommended."
  reference_answer: "Os motores Baldor saem de fábrica com graxa Polyrex EM (Exxon Mobil). Não é qualquer uma que serve: misturar graxas diferentes não é recomendado, e se quiser usar outra graxa é preciso consultar um Baldor Service Center."
  expected_facts: ["Polyrex EM"]
  requires_image: false
  notes: "Cross-lingual; colloquial two-part question whose complete answer needs the lubricant spec AND the no-mixing caution."

