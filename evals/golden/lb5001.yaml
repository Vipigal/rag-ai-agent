- id: lb5001-001
  question: "How often should I regrease a NEMA 250 frame motor rated 1800 RPM?"
  persona: technical
  language: en
  category: table_lookup
  gold_excerpts:
    - document: LB5001.pdf
      page: 2
      text: |-
        Relubrication Intervals
        NEMA (IEC) Frame Size Rated Speed (RPM)
        3600 1800 1200 900
        Over 210 to 280 incl. (180) 3600Hrs. 9500Hrs. 15000Hrs. 18000Hrs.
  reference_answer: "A NEMA 250 frame falls in the 'Over 210 to 280 incl.' row of the relubrication intervals table. At 1800 RPM the recommended relubrication interval is 9500 hours."
  expected_facts: ["9500"]
  requires_image: false
  notes: "Table row lookup requiring the reader to map frame 250 into the 'Over 210 to 280' range and cross it with the 1800 RPM column."

