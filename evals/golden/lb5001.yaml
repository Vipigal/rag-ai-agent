- id: lb5001-008
  question: "me ensina o jeito certo de engraxar o motor pra não estragar o rolamento"
  persona: operator
  language: pt
  category: procedure
  gold_excerpts:
    - document: LB5001.pdf
      page: 2
      text: "Clean the grease fitting (or area around grease hole, if equipped with slotted grease screws). If motor has a purge plug, remove it. Motors can be regreased while stopped (at less than 80°C) or running."
    - document: LB5001.pdf
      page: 2
      text: "Too much grease or injecting grease to quickly can cause premature bearing failure. Slowly apply the recommended amount of grease, taking 1 minute or so to apply. Operate motor for 20 minutes, then reinstall purge plug if previously removed."
  reference_answer: "Primeiro limpe a graxeira (ou a área do furo de graxa) e, se o motor tiver bujão de purga, remova-o. Pode engraxar com o motor parado (abaixo de 80 °C) ou rodando. Aplique a graxa devagar, levando cerca de 1 minuto — graxa demais ou injetada rápido demais causa falha prematura do rolamento. Depois deixe o motor operar por 20 minutos e reinstale o bujão de purga."
  requires_image: false
  notes: "Cross-lingual multi-excerpt procedure; the 'why' (bearing failure) is in the second excerpt."
