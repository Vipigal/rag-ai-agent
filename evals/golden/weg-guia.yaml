- id: weg-guia-002
  question: "tenho um motor trifásico de 100 cv, rendimento 93,5%, com fator de potência 0,87. que potência reativa de capacitores preciso pra chegar em 0,95?"
  persona: technical
  language: pt
  category: table_lookup
  gold_excerpts:
    - document: WEG-motores-eletricos-guia-de-especificacao-50032749-brochure-portuguese-web.pdf
      page: 9
      text: "Um motor elétrico, trifásico de 100 cv (75 kW), IV polos, operando com 100% da potência nominal, com fator de potência original de 0,87 e rendimento de 93,5%. Deseja-se calcular a potência reativa necessária para elevar o fator de potência para 0,95. Solução: Utilizando-se da Tabela 1.2, na intersecção da linha 0,87 com a coluna de 0,95, obtém-se o valor de 0,238, que multiplicado pela potência absorvida da rede pelo motor em kW, resulta no valor da potência reativa necessária"
    - document: WEG-motores-eletricos-guia-de-especificacao-50032749-brochure-portuguese-web.pdf
      page: 9
      text: "Q = 18,735 kVAr Onde: Q = Potência trifásica do banco de capacitores a ser instalado"
  reference_answer: "Pela tabela de correção do fator de potência, o fator na interseção de 0,87 (original) com 0,95 (desejado) é 0,238. Multiplicando pela potência absorvida da rede — 100 × 0,736 / 0,935 — chega-se a Q ≈ 18,735 kVAr de banco de capacitores."
  expected_facts: ["0,238", "18,735"]
  requires_image: false
  notes: "Worked example mirrored in the manual; the correction-factor matrix (Tabela 1.2) is a 20×20 grid — retrieval of the method text is what's gated."

