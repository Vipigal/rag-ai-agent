- id: weg-guia-027
  question: "o que são os termostatos que vêm dentro do motor e como eles funcionam?"
  persona: operator
  language: pt
  category: conceptual
  gold_excerpts:
    - document: WEG-motores-eletricos-guia-de-especificacao-50032749-brochure-portuguese-web.pdf
      page: 37
      text: "São sensores térmicos do tipo bimetálico com contatos de prata normalmente fechados, que se abrem ao atingir determinada elevação de temperatura. Quando a temperatura de atuação do bimetálico baixa, este volta a sua forma, original instantaneamente, permitindo o fechamento dos contatos novamente. Os termostatos podem ser destinados para sistemas de alarme, desligamento ou ambos (alarme e desligamento) de motores elétricos trifásicos."
  reference_answer: "São sensores bimetálicos com contatos de prata normalmente fechados: quando o motor esquenta além da temperatura de atuação, os contatos abrem (alarme e/ou desligamento); quando esfria, o bimetálico volta e os contatos fecham de novo. Ficam instalados nas cabeças de bobina de fases diferentes."
  requires_image: false
  notes: "Concept explanation for the operator persona; complements MN414's thermostat wiring case without overlapping ground truth."

- id: weg-guia-028
  question: "na placa do motor tem escrito FS 1,15. o que isso quer dizer na prática?"
  persona: operator
  language: pt
  category: conceptual
  gold_excerpts:
    - document: WEG-motores-eletricos-guia-de-especificacao-50032749-brochure-portuguese-web.pdf
      page: 44
      text: "Chama-se fator de serviço (FS) o fator que, aplicado à potência nominal, indica a carga permissível que pode ser aplicada continuamente ao motor, sob condições especificadas. Note que se trata de uma capacidade de sobrecarga contínua, ou seja, uma reserva de potência que dá ao motor uma capacidade de suportar melhor o funcionamento em condições desfavoráveis. O fator de serviço não deve ser confundido com a capacidade de sobrecarga momentânea, durante alguns minutos."
  reference_answer: "Quer dizer que o motor aguenta trabalhar continuamente com até 15% acima da potência nominal (uma reserva contínua de potência), nas condições especificadas. Não confundir com sobrecarga momentânea de alguns minutos — isso é outra coisa. FS 1,0 significaria sem reserva nenhuma."
  requires_image: false
  notes: "Definition question where the trap is confusing continuous service factor with momentary overload."

- id: weg-guia-029
  question: "o motor vai operar a 2.500 m de altitude. o que a norma exige de compensação?"
  persona: technical
  language: pt
  category: spec_lookup
