- id: weg-guia-005
  question: "How do I calculate the slip percentage of a 6-pole, 50 Hz motor that is running at 960 rpm?"
  persona: technical
  language: en
  category: conceptual
  gold_excerpts:
    - document: WEG-motores-eletricos-guia-de-especificacao-50032749-brochure-portuguese-web.pdf
      page: 15
      text: "Qual é o escorregamento de um motor de VI polos, 50 Hz, se sua velocidade é de 960 rpm? s (%) = 1000 - 960 1000 . 100 s (%) = 4%"
  reference_answer: "Slip s(%) = (ns − n)/ns × 100. A 6-pole motor at 50 Hz has synchronous speed ns = 120×50/6 = 1000 rpm, so s = (1000 − 960)/1000 × 100 = 4%."
  expected_facts: ["4%"]
  requires_image: false
  notes: "Cross-lingual (EN question over PT-only guide); the manual carries this exact worked example."

