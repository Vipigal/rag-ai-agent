      page: 44
      text: "Segundo as normas ABNT NBR 17094 e IEC 60034-1, a redução necessária na temperatura ambiente deve ser de 1% dos limites de elevação de temperatura para cada 100 m de altitude acima de 1.000 m. Esta regra é válida para altitudes até 4.000 m. Valores acima, consultar a WEG."
  reference_answer: "Acima de 1.000 m o ar rarefeito piora a refrigeração: a norma manda reduzir a temperatura ambiente admissível em 1% dos limites de elevação de temperatura a cada 100 m acima de 1.000 m (regra válida até 4.000 m — acima disso, consultar a WEG). A 2.500 m são 15% de redução; alternativas são isolante de classe superior ou derating de potência pela tabela do guia."
  expected_facts: ["1%"]
  requires_image: false
  notes: "Rule + applied arithmetic (2.500 m → 15%); the 4.000 m validity bound matters."

