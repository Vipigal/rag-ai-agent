- id: weg-guia-010
  question: "pra partir um motor com chave estrela-triângulo, quantos bornes ele precisa ter? e quanto a corrente de partida cai?"
  persona: technical
  language: pt
  category: spec_lookup
  gold_excerpts:
    - document: WEG-motores-eletricos-guia-de-especificacao-50032749-brochure-portuguese-web.pdf
      page: 21
      text: "É fundamental para a partida que o motor tenha a possibilidade de ligação em dupla tensão, ou seja, em 220/380 V, em 380/660 V ou 440/760 V. Os motores deverão ter no mínimo seis bornes de ligação. A partida estrela-triângulo poderá ser usada quando a curva de conjugado do motor é suficientemente elevada para poder garantir a aceleração da máquina com a corrente reduzida. Na ligação estrela, a corrente fica reduzida para 25% a 33% da corrente de partida na ligação triângulo."
  reference_answer: "No mínimo seis bornes de ligação, com dupla tensão nominal (220/380 V, 380/660 V ou 440/760 V). Na partida em estrela a corrente fica reduzida para 25% a 33% da corrente de partida em triângulo (aproximadamente 1/3) — e o conjugado de partida cai na mesma proporção."
  expected_facts: ["25%", "33%"]
  requires_image: false
  notes: "Two-part answer (terminals + current reduction) from one paragraph."

