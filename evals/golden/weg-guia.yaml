- id: weg-guia-036
  question: "em áreas classificadas, qual a diferença entre Zona 0, Zona 1 e Zona 2?"
  persona: technical
  language: pt
  category: conceptual
  gold_excerpts:
    - document: WEG-motores-eletricos-guia-de-especificacao-50032749-brochure-portuguese-web.pdf
      page: 48
      text: "Zona 0: Região onde a ocorrência de mistura inflamável e/ou explosiva é continua, ou existe por longos períodos. Por exemplo, a região interna de um tanque de combustível. Zona 1: Região onde a probabilidade de ocorrência de mistura inflamável e/ou explosiva está associada à operação normal do equipamento e do processo. Zona 2: Locais onde a presença de mistura inflamável e/ou explosiva não é provável de ocorrer, e se ocorrer, é por poucos períodos."
  reference_answer: "Zona 0: mistura inflamável/explosiva presente continuamente ou por longos períodos (ex.: interior de um tanque de combustível). Zona 1: presença provável em operação normal do equipamento/processo. Zona 2: presença improvável, e se ocorrer é por curtos períodos (operação anormal). Para poeiras combustíveis os análogos são as Zonas 20/21/22."
  requires_image: false
  notes: "Definition triple; the tank example anchors Zona 0."

