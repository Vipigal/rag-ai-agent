- id: weg-guia-031
  question: "pra que serve aquela resistência que fica dentro do motor? posso deixar ela ligada direto?"
  persona: operator
  language: pt
  category: conceptual
  gold_excerpts:
    - document: WEG-motores-eletricos-guia-de-especificacao-50032749-brochure-portuguese-web.pdf
      page: 47
      text: "As resistências de aquecimento são instaladas quando um motor elétrico é instalado em ambientes muito úmidos, (umidade > 95%) e/ou com possibilidade de ficar desligados por longos períodos (acima de 24 h), impedindo o acúmulo de água no interior do motor pela condensação do ar úmido. As resistências de aquecimento, aquecem o interior do motor alguns graus acima da temperatura ambiente (5 a 10 °C), quando o motor está desligado."
    - document: WEG-motores-eletricos-guia-de-especificacao-50032749-brochure-portuguese-web.pdf
      page: 47
      text: "As resistências de aquecimento só deverão ser energizadas com o motor desligado, caso contrário o motor poderá sofrer um sobreaquecimento, resultando em potenciais danos."
  reference_answer: "É a resistência de aquecimento: em ambiente muito úmido (>95%) ou com o motor parado por mais de 24 h, ela mantém o interior 5 a 10 °C acima do ambiente para não condensar água dentro do motor. E não — ela só pode ficar energizada com o motor DESLIGADO; com o motor rodando causa sobreaquecimento e dano."
  requires_image: false
  notes: "Multi-excerpt: function + the energize-only-when-off rule; the second half is the safety-critical part."

