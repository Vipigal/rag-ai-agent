  reference_answer: "Não. A comutação de estrela para triângulo só deve acontecer depois de o motor atingir pelo menos 90% da rotação nominal. Comutando antes, o pico de corrente fica parecido com o de uma partida direta — perde-se a vantagem da chave e ainda se castigam os contatos dos contatores."
