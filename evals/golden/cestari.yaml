- id: cestari-001
  question: "na plaquinha do redutor tem escrito M2 com um número do lado. isso é o quê?"
  persona: operator
  language: pt
  category: spec_lookup
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 6
      text: "P1: Potência do Motor ou do Redutor (kW). rpm: Rotação de saída do redutor. M2: Torque de Saída (Nm). fs: Fator de serviço. i: Redução Total."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 32
          text: "P1: Potencia del Motor o Reductor (kW). rpm: Rotación de salida del reductor (rpm). M2: Par de salida (Nm). fs: Factor de servicio. i: Reducción total."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 58
          text: "P1: Motor or Gear unit power (kW). rpm: Gear unit output speed (rpm). M2: Output Torque (Nm). sf: Gearmotor service factor. i: Speed ratio."
  reference_answer: "M2 é o torque de saída do redutor, em Nm (newton-metro). É um dos dados da placa de identificação, junto com P1 (potência em kW), rpm de saída, fs (fator de serviço) e i (redução total)."
  expected_facts: ["Nm"]
  requires_image: false
  notes: "Nameplate field decoding; the EN section calls the service factor 'sf' while PT/ES call it 'fs' — a cross-language vocabulary trap."

- id: cestari-002
  question: "o redutor aqui não tem parafuso de içamento. posso pendurar o conjunto todo só pelo olhal do motor?"
  persona: operator
  language: pt
  category: figure
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 7
      text: "Os redutores/motorredutores deverão ser movimentados utilizando-se do parafuso de suspensão (Fig.2A) e na inexistência deste, a unidade deverá ser suspensa através da carcaça do redutor (Fig.2B), em conjunto com o olhal do motor (Fig.2C) respeitando o ângulo máximo de 60º entre os cabos. Nunca suspenda o equipamento somente através do motor."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 33
          text: "Los reductores/motorreductores deberán ser movidos haciendo uso del cáncamo de izaje (Fig.2A), ante la inexistencia de éste, la unidad deberá ser suspendida a través de la carcasa del reductor (Fig.2B), en conjunto con el cáncamo del motor (Fig.2C) respetando el ángulo máximo de 60º entre los cables. Jamás izar el equipo solamente a través del motor."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 59
          text: "The gear units/gearmotors must be moved using the lifting eyebolt (Fig. 2A) and, if eyebolt is not present, the unit must be lifted through the gear unit housing (Fig.2B), together with the eyebolt of the motor (Fig.2C) observing the maximum angle of 60º between the cables. Never lift the equipment only through the motor."
  reference_answer: "Não — nunca suspenda o equipamento somente pelo motor. Sem o parafuso de suspensão, o conjunto deve ser suspenso pela carcaça do redutor junto com o olhal do motor, respeitando o ângulo máximo de 60° entre os cabos."
  expected_facts: ["60"]
  requires_image: false
  notes: "Figure-anchored (Figuras 2A-2C); the prohibition is underlined in the manual — a hard safety fact."

- id: cestari-003
  question: "quais os limites de umidade e temperatura pra armazenar redutor parado no almoxarifado?"
  persona: technical
  language: pt
  category: spec_lookup
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 7
      text: "devem ser armazenados em sua embalagem original em ambiente fechado (não expostos diretamente aos raios solares ou raios UV), seco, protegido contra insetos, livre de poeira, umidade do ar inferior a 60%, isentos de gases, fungos, agentes corrosivos (ar contaminado, ozônio, gases, solventes, ácidos, alcalina, sais, radioatividade, etc.) e temperatura ambiente entre -5ºC a +40ºC."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 33
          text: "deben ser almacenados en su embalaje original en ambiente cerrado (no expuestos directamente a los rayos solares o rayos UV), seco, protegido contra insectos, libre de polvo, humedad del aire inferior a 60%, exentos de gases, hongos, agentes corrosivos (aire contaminado, ozono, gases, solventes, ácidos, alcalina, sales, radioactividad, etc.) y a una temperatura ambiente entre -5ºC y +40ºC."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 59
          text: "must be stored in its original package in a closed (not directly exposed to sunrays or UV rays) and dry environment protected against vermin with relative humidity below 60% and free of dust, gases, fungi and corrosive agents (contaminated air, ozone, gases, solvents, acids, alkaline products, salts, radioactivity, etc.). and ambient temperature between -5ºC to +40ºC."
  reference_answer: "Umidade do ar inferior a 60% e temperatura ambiente entre -5 °C e +40 °C, em embalagem original, ambiente fechado e seco, sem exposição direta a sol/UV, livre de poeira e agentes corrosivos."
  expected_facts: ["60%", "40"]
  requires_image: false
  notes: "Multi-value environmental spec; answer must carry both humidity and temperature bounds."

- id: cestari-004
  question: "o redutor vai ficar uns 7 meses parado no estoque antes de instalar. precisa fazer alguma coisa nele nesse meio tempo?"
  persona: operator
  language: pt
  category: procedure
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 8
      text: "Para períodos de 6 meses até 9 meses sem operação, é recomendado preencher todo interior do redutor com lubrificantes apropriados"
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 34
          text: "Para períodos desde 6 a 9 meses sin operación, es recomendado llenar todo interior del reductor con lubricantes apropiados"
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 60
          text: "For periods from six months to nine months out of operation, it is recommended to fill the gear unit with proper lubricants"
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 8
      text: "O eixo de entrada do redutor deverá ser girado no mínimo duas voltas completas e este procedimento deverá ser repetido, no mínimo, 1 vez a cada 2 meses."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 34
          text: "El eje de entrada del reductor deberá ser girado un mínimo de dos vueltas completas y este procedimiento deberá ser repetido, como mínimo, 1 vez cada 2 meses."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 60
          text: "The high-speed shaft (the gear unit input shaft) must be turned at least two complete revolutions and this procedure shall be repeated at least once every two months."
  reference_answer: "Precisa. Para 6 a 9 meses parado: encher todo o interior do redutor com lubrificante apropriado até a parte superior (logo abaixo do respiro), para engrenagens e rolamentos ficarem imersos, e girar o eixo de entrada pelo menos duas voltas completas, repetindo no mínimo 1 vez a cada 2 meses. Antes de operar, drenar o óleo até o nível adequado de operação."
  requires_image: false
  notes: "Multi-excerpt procedure; the drain-before-operation step (NOTAS on the same page) belongs in the ideal answer even though it isn't a gold slot."

- id: cestari-005
  question: "vou hibernar um redutor por mais de 9 meses. qual a proporção de VCI no óleo? e se o redutor veio sem óleo de fábrica?"
  persona: technical
  language: pt
  category: spec_lookup
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 9
      text: "Nos redutores fornecidos com óleo lubrificante, acrescentar agente anticorrosivo VCI (Volatile Corrosion Inhibitor) no lubrificante na medida de 2% da capacidade de lubrificante. Depois gire os eixos várias vezes;"
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 35
          text: "En los reductores suministrados con aceite lubricante, agregar agente anticorrosivo VCI (Volatile Corrosion Inhibitor) en el lubricante, en la medida de 2% de la capacidad del lubricante. Después gire los ejes varias veces;"
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 61
          text: "For gear units supplied with lubricating oil, add VCI anticorrosive agent (Volatile Corrosion Inhibitor) in the lubricant up to the ration of 2% of lubricant capacity. Then turn the shafts several times;"
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 9
      text: "Nos casos de redutores fornecidos sem óleo, misturar 10% do volume total do lubrificante recomendado nos manuais com 2% também deste volume total de VCI e abastecer o redutor. Referência de VCI aditivo MV OIL 1061"
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 35
          text: "En caso de reductores suministrados sin aceite, mezclar 10% del volumen total del lubricante recomendado en los manuales, con 2% también de este volumen total de VCI y ponerlo en el reductor. Referencia de VCI aditivo MV OIL 1061"
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 61
          text: "In the case of gear units supplied without oil, mix 10% of the total volume of lubricant recommended in the manuals with 2% of this total volume of VCI and put into the gear unit. Reference of VCI additive MV OIL 1061"
  reference_answer: "Redutor fornecido com óleo: adicionar VCI (Volatile Corrosion Inhibitor) na medida de 2% da capacidade de lubrificante e girar os eixos várias vezes. Redutor fornecido sem óleo: misturar 10% do volume total do lubrificante recomendado com 2% desse volume total de VCI e abastecer. Referência de aditivo: MV OIL 1061."
  expected_facts: ["2%", "10%"]
  requires_image: false
  notes: "Two-branch spec with an exact additive identifier (MV OIL 1061); multi-excerpt on the same page."

- id: cestari-006
  question: "um redutor ficou guardado 3 anos no galpão. o que tem que substituir antes de colocar pra rodar?"
  persona: technical
  language: pt
  category: conceptual
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 10
      text: "Caso o tempo de armazenamento ou parada ultrapasse 2 anos ou a temperatura ambiente se desvie do intervalo normal durante o armazenamento, é necessário substituir o lubrificante do redutor antes da entrada em funcionamento."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 36
          text: "En caso de que el tiempo de almacenamiento o de parada sobrepase 2 años, o la temperatura ambiente se desvíe del intervalo normal durante el almacenamiento, será necesario sustituir el lubricante del reductor, antes de su puesta en marcha."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 62
          text: "If the storage or downtime exceeds 2 years or the ambient temperature deviates from the normal range during storage, it is necessary to replace the gear unit lubricant before commissioning."
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 10
      text: "Considerando que os mesmos foram devidamente lubrificados, após 2 (dois) anos, os retentores devem ser substituídos."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 36
          text: "Considerando que éstos fueron debidamente lubricados, tras 2 (dos) años, los retenes deberán ser reemplazados"
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 62
          text: "Considering that they have been properly lubricated, after 2 (two) years, the lip seals must be replaced."
  reference_answer: "Depois de mais de 2 anos parado é preciso substituir o lubrificante do redutor antes da entrada em funcionamento e também substituir os retentores. Além disso: remover fitas usadas na armazenagem, remover umidade acumulada e inspecionar avarias; o agente VCI é solúvel no óleo recomendado e não precisa ser retirado."
  requires_image: false
  notes: "Threshold reasoning (3 anos > 2 anos) + two replacements; a common miss is answering only the lubricant."

- id: cestari-007
  question: "o redutor novo veio com uma borrachinha presa na válvula de respiro. é pra deixar ou tirar?"
  persona: operator
  language: pt
  category: figure
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 11
      text: "Para os motorredutores/redutores fornecidos com válvula de respiro lacrada com borracha para transporte, antes do funcionamento do motorredutor/redutor remova totalmente a borracha de proteção instalada na válvula"
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 20
          text: "Para os motorredutores/redutores fornecidos com válvula de respiro lacrada com borracha para transporte, antes do funcionamento do motorredutor/redutor remova totalmente a borracha de proteção instalada na válvula"
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 37
          text: "Para los motorreductores/reductores suministrados con válvula de respiración (respiradero) lacrada con goma para transporte, antes del arranque del motorreductor/reductor, remueva totalmente la goma de protección instalada en la válvula"
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 63
          text: "For gearmotors/gear units supplied with a breather valve sealed with a rubber part for transportation, before operation, completely remove the protection rubber part installed in the valve"
  reference_answer: "É pra tirar. A borracha é só um lacre de transporte: antes de o redutor funcionar, remova totalmente a borracha de proteção da válvula de respiro — só depois disso a válvula está pronta para operar. Se ficar, o respiro obstruído pode causar vazamento de óleo."
  requires_image: false
  notes: "Figure-anchored (3-step removal drawing). The same sentence repeats verbatim on the PT operation page (20) — listed as an alternate so citation of either page counts."

- id: cestari-008
  question: "tô limpando o verniz de proteção da ponta do eixo. pode usar uma lixa fininha que sai mais rápido?"
  persona: operator
  language: pt
  category: safety
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 11
      text: "As pontas dos eixos estão protegidas com uma fina camada de óleo anticorrosivo, este óleo deve ser removido antes da instalação, utilizando solventes normais (varsol, aguarrás ou outro similar). ATENÇÃO: O solvente não poderá atingir os retentores e jamais use lixa para remoção do verniz."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 37
          text: "Las puntas de los ejes están protegidas con una camada delgada de aceite anticorrosivo, este aceite deberá ser removido antes de la instalación, utilizando solventes normales (varsol, aguarrás u otro similar). ATENCIÓN: El solvente no podrá alcanzar los retenes. Jamás use lija para la remoción del barniz."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 63
          text: "The shaft ends are protected with a thin layer of anti-corrosive oil; this oil must be removed before installation with regular solvents (varsol, turpentine or the like). ATTENTION: The solvent cannot reach the lip seals, and never use sandpaper to remove the varnish."
  reference_answer: "Não pode — jamais use lixa para remover o verniz. Use solventes normais (varsol, aguarrás ou similar), tomando cuidado para o solvente não atingir os retentores."
  requires_image: false
  notes: "Explicit prohibition ('jamais use lixa') phrased as a tempting shortcut."

- id: cestari-009
  question: "vou montar uma corrente de rolos no eixo de saída do redutor. como calculo o diâmetro mínimo dela e qual fator kr entra na conta?"
  persona: technical
  language: pt
  category: conceptual
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 12
      text: "verificando também o diâmetro mínimo admissível (Dmin, mm), do elemento de transmissão através da equação que se segue: Dmin = 2000 Mc Fr kr Onde: Mc = Momento a ser transmitido (Nm). Fr = Carga radial admissível no eixo de saída do redutor (N) Kr = Fator adicional."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 38
          text: "verificando también el diámetro mínimo admisible (Dmin, mm), del elemento de transmisión, a través de la ecuación siguiente: Dmin = 2000 Mc Fr kr Donde: Mc = Momento a ser transmitido (Nm). Fr = Carga radial admisible en el eje de salida del reductor (N) Kr = Factor adicional."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 64
          text: "also checking the minimum diameter allowed (Dmin, mm) of the transmission element through the following equation: Dmin = 2000 Mc Fr kr Where: Mc = Torque to be transmitted (Nm). Fr = Radial load accepted on the gear unit output shaft (N) Kr = Additional factor."
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 13
      text: "Valores para o fator kr: Correia plana com esticador: 2,5 Correia plana sem esticador: 5 Correia trapezoidal sem esticador: 1,75 Corrente de rolos ou corrente silenciosa: 1,4 Engrenagens: 1,15"
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 39
          text: "Valores para el factor kr: Correa plana con estirador: 2,5 Correa plana sin estirador: 5 Correa trapezoidal sin estirador: 1,75 Cadena de rodillos o cadena silenciosa: 1,4 Engranajes: 1,15"
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 65
          text: "Values for the Kr factor: Flat belt with tightener: 2.5 Flat belt without tightener: 5 Trapezoidal belt without tightener: 1.75 Roller chain or silent chain: 1.4 Gears: 1.15"
  reference_answer: "Use a equação Dmin = (2000 × Mc / Fr) × kr, onde Mc é o momento a ser transmitido (Nm), Fr é a carga radial admissível no eixo de saída (N) e kr é o fator adicional do elemento de transmissão. Para corrente de rolos (ou corrente silenciosa), kr = 1,4. O resultado Dmin sai em mm, e é preciso observar o paralelismo entre os eixos."
  expected_facts: ["2000", "1,4"]
  requires_image: false
  notes: "Formula case — pymupdf4llm renders in-text formulas as pseudo-tables (corpus findings), so this probes formula ingestion; excerpts flatten the equation and drop dot leaders, relying on token overlap. EN uses decimal point (1.4) where PT/ES use comma (1,4)."

- id: cestari-010
  question: "a polia tá dura pra entrar no eixo do redutor. umas marteladas de leve resolvem?"
  persona: operator
  language: pt
  category: safety
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 13
      text: "O uso de martelo na montagem desses elementos pode danificar os rolamentos e os dentes das engrenagens do redutor."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 14
          text: "É inadmissível a montagem por meio de golpes, pois este método danifica rolamentos e dentes das engrenagens."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 39
          text: "El uso de martillo en el montaje de tales elementos puede dañar los rodamientos y los dientes de los engranajes del reductor."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 61
          text: "Using a hammer in the assembly of those elements may damage the rolling bearings and teeth of the gears of the gear unit."
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 13
      text: "É conveniente aquecer a peça a montar até cerca de 100ºC; podendo ser utilizado o furo de centro rosqueado na ponta do eixo do redutor no auxílio da montagem"
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 39
          text: "Es conveniente calentar la pieza que se va a montar hasta cerca de 100ºC; utilizando caso necesario el agujero de centro roscado en la punta del eje del reductor en el auxilio del montaje"
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 65
          text: "It is convenient to heat the part to be mounted up to about 100ºC; the threaded center hole on the gear unit shaft end may be used to help mount the transmission element"
  reference_answer: "Não — martelada é inadmissível: danifica os rolamentos e os dentes das engrenagens do redutor. O jeito certo: a polia deve ter furo com tolerância H7 e montagem com leve interferência; aqueça a peça até cerca de 100 °C e use o furo de centro rosqueado na ponta do eixo para auxiliar a montagem, travando depois contra deslocamento axial."
  expected_facts: ["100"]
  requires_image: false
  notes: "Multi-excerpt safety + procedure; the hammer prohibition appears on two consecutive PT pages (13 and 14 — page 14 listed as alternate)."

- id: cestari-011
  question: "qual graxa antioxidante é a recomendada pra montar redutor de eixo vazado?"
  persona: technical
  language: pt
  category: spec_lookup
