      page: 14
      text: "Para evitar oxidações de contato e dificuldades na montagem, é recomendado aplicar e espalhar graxas antioxidantes (como a Dow Corning Molykote G-Rapid Plus ou similares) sobre o eixo, no alojamento e na chaveta."
