          page: 40
          text: "Para evitar oxidaciones de contacto y dificultades en el montaje es recomendado aplicar y esparcir grasas antioxidantes (como Dow Corning Molykote G-Rapid Plus o similares) sobre el eje, en el alojamiento y en la chaveta."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 66
          text: "In order to prevent contact oxidations and difficulties the mounting, it is recommended to spread antioxidant greases (such as Dow Corning Molykote G-Rapid Plus or the like) on the shaft, on the housing and on the key."
  reference_answer: "Dow Corning Molykote G-Rapid Plus (ou similar), aplicada e espalhada sobre o eixo, no alojamento e na chaveta — evita oxidação de contato e facilita a montagem. E nunca monte redutor de eixo vazado por golpes."
