- id: cestari-015
  question: "o redutor que tem bomba de óleo acoplada pode girar pros dois lados?"
  persona: operator
  language: pt
  category: safety
  gold_excerpts:
    - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
      page: 18
      text: "A Bomba de Engrenagens atua somente em um único sentido de giro (unidirecional). Não é permitido girar em sentido contrário, pois poderá ocasionar perda de eficiência, desgaste excessivo dos componentes internos, superaquecimento devido à falta de lubrificação, além de danificar o sistema de vedação interno e externo da bomba."
      alternates:
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 44
          text: "La Bomba de Engranajes actúa solamente en un único sentido de giro (unidireccional). No es permitido girar en sentido contrario, ya que podrá ocasionar pérdida de eficiencia, desgaste excesivo de los componentes internos, supercalentamiento debido a la falta de lubricación, además de dañar el sistema de sellado interno y externo de la bomba."
        - document: WEG-CESTARI-manual-iom-guia-consulta-rapida-50111652-pt-en-es-web.pdf
          page: 70
          text: "The Gear Pump operates only in one direction of rotation (unidirectional). It is not allowed to turn in the opposite direction, as it may cause loss of efficiency, excessive wear of the internal components, overheating due to lack of lubrication, and damage to the internal and external sealing system of the pump."
  reference_answer: "Não — quando o redutor tem bomba de engrenagens, ela é unidirecional: girar no sentido contrário é proibido, porque causa perda de eficiência, desgaste dos componentes internos, superaquecimento por falta de lubrificação e dano à vedação da bomba. O sentido certo é indicado por uma seta fixada próximo ao eixo."
  requires_image: false
  notes: "Warning-block content (ATENÇÃO box); tests that warning boxes survive ingestion."

