- id: mn414-001
  question: "How much oil does a 250TY frame submersible pump motor take?"
  persona: technical
  language: en
  category: table_lookup
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 11
      text: |-
        Table 2-1 Oil Amount by Frame Size
        Frame Size Oil Spec Quantity
        Min. Quarts Max. Quarts
        250TY 4824-18-AF 3.0 3.5
  reference_answer: "A 250TY frame takes between 3.0 and 3.5 quarts of oil (oil spec 4824-18-AF)."
