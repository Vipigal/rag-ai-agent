- id: mn414-002
  question: "qual óleo que vai no motor da bomba submersa?"
  persona: operator
  language: pt
  category: spec_lookup
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 11
      text: "Recommended lubricant is Shell Rotella 10 SAE 10W."
  reference_answer: "O lubrificante recomendado é o Shell Rotella 10 SAE 10W. A quantidade depende da carcaça do motor, e a manutenção deve ser feita por oficina qualificada, porque a construção do motor é vedada à água e os selos cerâmicos danificam fácil."
  expected_facts: ["Shell Rotella"]
  requires_image: false
  notes: "Cross-lingual spec lookup; exact product identifier must survive retrieval and generation."

- id: mn414-003
  question: "What is the maximum submergence depth for a tandem seal submersible motor, and does it change for slurry seal designs?"
  persona: technical
  language: en
  category: spec_lookup
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 8
      text: "Maximum submergence of motor is not to exceed 160 ft (49m) in depth or 100 PSI (690 kpas) at the external motor seal for Tandem Seal designs. For slurry seal designs the maximum external motor seal pressure is 15 PSI (103 kpas)."
  reference_answer: "For Tandem Seal designs, maximum submergence is 160 ft (49 m) in depth or 100 PSI (690 kPa) at the external motor seal. For slurry seal designs the limit is lower: maximum external motor seal pressure of 15 PSI (103 kPa)."
  expected_facts: ["160", "100 PSI", "15 PSI"]
  requires_image: false
  notes: "Two-part spec with a contrast (tandem vs slurry); a lazy answer that gives only 160 ft misses half the facts."

