- id: mn414-006
  question: "vou içar o conjunto motor e bomba com cabo de aço, sem barra. tem ângulo máximo pro cabo?"
  persona: operator
  language: pt
  category: figure
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 7
      text: "Lift using Lift Eyes only. Lifting by power cords will cause motor damage. Use spreader bar to evenly distribute lift force. Angle of lift rope (no spreader bar) should not exceed 45° from vertical, excessive lift angle can damage motor."
  reference_answer: "Tem: sem barra espaçadora (spreader bar), o ângulo do cabo não pode passar de 45° em relação à vertical — ângulo excessivo danifica o motor. Ice somente pelos olhais de içamento, nunca pelos cabos elétricos, e o método preferido é com barra espaçadora."
  expected_facts: ["45"]
  requires_image: false
  notes: "Figure-anchored (caution beside Figure 2-1 Lift Methods): answerable from the text around the figure — gates the text↔figure linkage."

- id: mn414-007
  question: "The pump is spinning backwards on a three phase motor. What's the fix?"
  persona: technical
  language: en
  category: procedure
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 8
      text: "For three phase motors only: To reverse direction of a three phase motor, interchange any two motor lead connections at the starter."
  reference_answer: "Interchange any two of the three motor lead connections at the starter — that reverses rotation on a three phase motor. Turn off and lock out all power and verify zero voltage at the motor leads before touching connections, then restore power and verify correct rotation."
  requires_image: false
  notes: "Classic field question; the core fact is one sentence, the safe procedure (lockout, verify) lives in the surrounding installation steps."

- id: mn414-008
  question: "o motor tem uns sensores de umidade, mas cadê o alarme? é só ligar os fios que ele apita?"
  persona: operator
  language: pt
  category: procedure
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 10
      text: "A leakage detector control such as Ametek APT Series 8040MD Moisture Detector (or equivalent) must be purchased separately. The leakage detector control system must be connected for the warranty and the U/L listing to be valid."
    - document: MN414_0224.pdf
      page: 10
      text: "IMPORTANT: Failure to properly connect and use this leakage detector system voids motor warranty."
  reference_answer: "Não — o motor traz só as sondas de umidade. O controle detector de vazamento (por exemplo um Ametek APT Série 8040MD, ou equivalente) é vendido separadamente e precisa ser comprado e ligado. E atenção: se o detector não for conectado e usado corretamente, a garantia do motor perde a validade."
  expected_facts: ["Ametek"]
  requires_image: false
  notes: "Cross-lingual multi-excerpt; the warranty-voiding consequence is the part an operator most needs and most often misses."

- id: mn414-009
  question: "Which motor lead is the white power cable wire on a polyphase submersible motor?"
  persona: technical
  language: en
  category: table_lookup
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 9
      text: |-
        Motor Power Cable Lead Color
        Black White Red Orange Green
        Polyphase T1 T2 T3 - Ground
  reference_answer: "On a polyphase motor the white wire is lead T2. The full color code is: black = T1, white = T2, red = T3, green = ground."
