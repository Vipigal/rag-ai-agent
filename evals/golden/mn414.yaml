- id: mn414-015
  question: "We have a submersible pump motor that sat in the warehouse for eight months. Anything special required before putting it into service?"
  persona: technical
  language: en
  category: spec_lookup
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 6
      text: "The motor must be stored shaft down in its' original packaging until it is to be into service. The motor should only be lifted using the lifting eyes provided, see Figure 2-1. If the motor must be stored for more than 6 months, the procedures described in MN417 must be followed to prevent motor damage."
  reference_answer: "Yes — storage beyond 6 months requires following the procedures described in manual MN417 to prevent motor damage. The motor should also have been stored shaft down in its original packaging, and must only be lifted by the lifting eyes."
  expected_facts: ["MN417"]
  requires_image: false
  notes: "Exact document-identifier answer (MN417) — the kind of token pure vector search tends to miss (Decision 0005's hybrid-search motivation)."

- id: mn414-016
  question: "tem dois fio saindo do motor escrito W1 e W2, servem pra quê?"
  persona: operator
  language: pt
  category: conceptual
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 8
      text: "Moisture Sensing Probes must be connected. Leads marked W1 and W2. (See Figure 2-3)."
    - document: MN414_0224.pdf
      page: 10
      text: "Dual moisture sensing probes extend into the oil chamber located between the tandem mechanical seals. Should the outer seal fail, water will enter the oil chamber through the labyrinth slinger paths and create a water/oil emulsion in the oil chamber."
  reference_answer: "W1 e W2 são os fios das sondas de detecção de umidade. As duas sondas ficam na câmara de óleo, entre os selos mecânicos: se o selo externo falhar e entrar água, a mistura água/óleo aumenta a condutividade e o detector de umidade percebe. Esses fios devem ser conectados ao controle detector de vazamento."
  requires_image: false
  notes: "Cross-lingual, exact-identifier (W1/W2) + multi-excerpt spanning pages 8 and 10."

- id: mn414-017
  question: "quantos contatos tem aquele conector redondo no topo do motor onde encaixa o cabo de força?"
  persona: operator
  language: pt
  category: image_content
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 13
      text: "Figure 3-3 Cable receptacle Insert the cable into the receptacle. Insure that the protrusion on the cable lines up with the receptacle notch. Insert the cable and make sure the cable is fully inserted."
  reference_answer: "O receptáculo do cabo tem 3 contatos, um para cada cabo de força (T1, T2 e T3) — é o que a foto do receptáculo (Figure 3-3) mostra. O encaixe é guiado pelo ressalto do cabo alinhado com o entalhe do receptáculo."
  expected_facts: ["3"]
  requires_image: true
  notes: "requires_image case: the contact count is only visible in the Figure 3-3 photo (corroborated by the '3 marked power leads' note on page 8). Diagnostic track."
