- id: mn414-010
  question: "posso descer a bomba no poço segurando pelo cabo elétrico?"
  persona: operator
  language: pt
  category: safety
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 6
      text: "Never raise or lower the motor/pump by the power cords. Use lifting eyes provided in the motor casting (opposite drive end) and attach a cord/cable to lift the weight of the motor and pump. Failure to lift this motor properly may seriously damage the lead connections and water seals and seriously damage the motor."
  reference_answer: "Nunca. Não se levanta nem se desce o conjunto motor/bomba pelos cabos elétricos — use os olhais de içamento fundidos na carcaça (no lado oposto ao acionamento) com um cabo próprio. Içar errado pode danificar seriamente as conexões elétricas, os selos de vedação e o próprio motor."
  requires_image: false
  notes: "Cross-lingual safety; the same caution appears twice in the manual (pages 6 and 7) — either page satisfies citation ground truth via this excerpt."

- id: mn414-011
  question: "How much voltage and frequency deviation from nameplate can these pump motors tolerate?"
  persona: technical
  language: en
  category: spec_lookup
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 8
      text: "Motor will operate properly with frequency not more than ±5% and voltage not more than ±10% above or below nameplate rating."
  reference_answer: "Frequency may deviate at most ±5% and voltage at most ±10% above or below the nameplate rating. Performance within this range will not necessarily match the performance at exact rated voltage and frequency."
  expected_facts: ["5%", "10%"]
  requires_image: false
  notes: "Tolerance pair — answers that swap the two percentages are wrong; expected_facts alone can't catch a swap, the judge diagnostic can."

- id: mn414-012
  question: "a bomba parou sozinha do nada. o que costuma derrubar ela?"
  persona: operator
  language: pt
  category: procedure
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 11
      text: "Motor operation may stop for one of the following trip conditions: 1. If moisture infiltrates the motor, the moisture detector circuit will activate. 2. If the motor overheats, the Thermal Protection circuit will activate. 3. Other condition detected by motor starter (over current, over voltage, etc. if equipped)"
  reference_answer: "Três causas comuns de desarme: entrou umidade no motor e o circuito do detector de umidade atuou; o motor superaqueceu e a proteção térmica atuou; ou o starter detectou alguma outra condição, como sobrecorrente ou sobretensão (se equipado)."
  requires_image: false
  notes: "Cross-lingual troubleshooting; open operator phrasing ('parou sozinha') vs the manual's 'trip conditions' vocabulary."

- id: mn414-013
  question: "How do I wire the thermostat leads on a submersible pump motor, and can I rely on them for locked rotor protection?"
  persona: technical
  language: en
  category: conceptual
  gold_excerpts:
    - document: MN414_0224.pdf
      page: 9
      text: "Thermostat leads marked P1 & P2 must be connected in series with the stop button of the 3−wire pilot circuit of the magnetic motor controller, so that the thermostat will open the circuit before dangerous temperatures are reached"
    - document: MN414_0224.pdf
      page: 9
      text: "Thermostats do not provide winding over temperature protection (locked rotor). It is suggested that over current protection be used in the motor starter to ensure locked rotor protection."
    - document: MN414_0224.pdf
      page: 5
      text: "Thermostat contacts automatically reset when the motor has slightly cooled down. To prevent injury or damage, the control circuit should be designed so that automatic starting of the motor is not possible when the thermostat resets."
  reference_answer: "Connect thermostat leads P1 and P2 in series with the stop button of the 3-wire pilot circuit of the magnetic motor controller, so the thermostat opens the circuit before dangerous temperatures are reached. Do not rely on them for locked rotor protection — thermostats do not provide it; use over current protection in the motor starter. Also note the contacts reset automatically as the motor cools, so the control circuit must be designed so the motor cannot restart by itself on reset."
  expected_facts: ["P1", "P2"]
  requires_image: false
  notes: "Three-excerpt case spanning pages 5 and 9 — stresses recall@5 with multiple relevant chunks and cross-page synthesis."

