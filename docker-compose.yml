services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-chunks}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-google:gemini-embedding-001}
      LLM_MODEL: ${LLM_MODEL:-openai:gpt-5-mini}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-google:gemini-3.5-flash}
      LLM_THINKING: ${LLM_THINKING:-low}
      RETRIEVAL_K: ${RETRIEVAL_K:-5}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-3}
      QUERY_KNOWLEDGE_ENABLED: ${QUERY_KNOWLEDGE_ENABLED:-true}
    depends_on:
      qdrant:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --app-dir src --reload

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

volumes:
  qdrant_data:
